<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Refined Flip Popouts</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #ffe9cf;
    margin: 0;
    padding: 100px 20px;
    font-family: 'Work Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .flip-list-w {
    list-style: none;
    padding: 0;
    margin: 0;
    width: min(88%, 34rem);
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  .flip-li {
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .flip-li:hover {
    z-index: 50;
  }

  .flip-card-container {
    position: relative;
    width: 100%;
  }

  /* Main Image Box */
  .flip-item {
    position: relative;
    z-index: 2;
    aspect-ratio: 389/193;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(0, 0, 0, 0.15);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    background-color: #0d0d0d;
    cursor: pointer;
  }

  .flip-project-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .flip-project-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  /* Visit Site Button: Pops out from BEHIND the image towards the RIGHT, Blue #3d77ff */
  .flip-visit-btn {
    position: absolute;
    top: 50%;
    right: 0;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    background-color: #3d77ff;
    color: #ffffff;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    border: 2px solid #270f03;
    box-shadow: 0 8px 24px rgba(61, 119, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.15);
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-50%) translateX(0);
    transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.28s ease,
                visibility 0.28s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
    cursor: pointer;
  }

  .flip-card-container.is-fully-appeared:hover .flip-visit-btn {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(-50%) translateX(calc(100% + 20px));
  }

  .flip-visit-btn:hover {
    background-color: #2962ff;
    box-shadow: 0 12px 30px rgba(41, 98, 255, 0.5), 0 6px 14px rgba(0, 0, 0, 0.2);
    transform: translateY(-50%) translateX(calc(100% + 22px)) scale(1.04);
  }

  .flip-visit-btn svg {
    transition: transform 0.2s ease;
  }
  .flip-visit-btn:hover svg {
    transform: translate(2px, -2px);
  }

  /* Info on the LEFT side: NO box, heading + 1 line description directly on bg */
  .flip-info-wrap {
    position: absolute;
    top: 50%;
    left: 0;
    z-index: 1;
    width: min(290px, 35vw);
    text-align: right;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-50%) translateX(0);
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.3s ease,
                visibility 0.3s ease;
  }

  .flip-card-container.is-fully-appeared:hover .flip-info-wrap {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(-50%) translateX(calc(-100% - 24px));
  }

  .flip-info-title {
    font-family: 'Anton', sans-serif;
    font-size: 26px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #270f03;
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .flip-info-desc {
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    line-height: 1.4;
    color: rgba(39, 15, 3, 0.8);
    margin: 0;
  }
</style>
</head>
<body>

<ul class="flip-list-w">
  <li class="flip-li">
    <div class="flip-card-container is-fully-appeared">
      <!-- Left side info on bg (no box) -->
      <div class="flip-info-wrap">
        <div class="flip-info-title">Personal Portfolio</div>
        <p class="flip-info-desc">Crafted to showcase skills and projects with smooth 60fps animations.</p>
      </div>

      <!-- Main Image -->
      <div class="flip-item">
        <div class="flip-project-frame">
          <img src="../Project Images/Portfolio Website.png" alt="Portfolio Website" class="flip-project-img">
        </div>
      </div>

      <!-- Right side Blue Visit Site button from behind image -->
      <a href="https://jishnumondal.vercel.app/" target="_blank" class="flip-visit-btn">
        <span>Visit Site</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
      </a>
    </div>
  </li>

  <li class="flip-li">
    <div class="flip-card-container is-fully-appeared">
      <div class="flip-info-wrap">
        <div class="flip-info-title">Cafe Management</div>
        <p class="flip-info-desc">Full-stack cafe management with real-time orders, menu, and reservations.</p>
      </div>
      <div class="flip-item">
        <div class="flip-project-frame">
          <img src="../Project Images/Cafe Website.png" alt="Cafe Website" class="flip-project-img">
        </div>
      </div>
      <a href="https://mochaandmiso.web.app/" target="_blank" class="flip-visit-btn">
        <span>Visit Site</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
      </a>
    </div>
  </li>
</ul>

</body>
</html>
